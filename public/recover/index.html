<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
  <meta name="openrotmg-api" content="{{API_ORIGIN}}"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' {{API_ORIGIN}}; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <script src="{{BASE}}backend.js" defer></script>
<title>Reset password · Open RotMG</title>
<link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body><main>
<h1>Reset your game password</h1>
<p>Never enter a password in Discord. Completing this reset saves and disconnects your active game connection.</p>
<p id="status" role="status">Checking reset link…</p>
<form id="reset" hidden>
<label for="password">New password</label><input id="password" type="password" autocomplete="new-password" maxlength="128" required>
<label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128" required>
<p>Use 5–128 UTF-8 bytes, without control characters.</p>
<button type="submit">Reset password</button>
</form>
<p><a href="../">Return to the game</a></p>
</main></body></html>
