<div class="site-shell">

    <a href="original-client.swf" download>Original client</a> · <a href="https://github.com/dginovker/Open-RotMG-Server/tree/b70d95ff30fae59864f6271417ad997c918ff0f4">2010 source</a> · <a href="https://openrotmg.org/restoration/2010/">Restoration checklist</a></p>

  </footer>
